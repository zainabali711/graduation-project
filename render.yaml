services:
  - type: web
    name: cyberscan
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONUNBUFFERED=1 python -m gunicorn app:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 8 --timeout 60 --capture-output --enable-stdio-inheritance --log-level info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: VIRUSTOTAL_SSL_VERIFY
        value: "true"
      # Set manually in Render Dashboard to your Supabase Session pooler URI
      # (postgresql://...pooler.supabase.com:5432/postgres). App appends sslmode=require if missing.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_SETUP_SECRET
        sync: false
