{% extends "base.html" %}

{% block title %}URL Scanner — CyberScan{% endblock %}

{% block content %}
<main class="page-shell landing">
  <div class="landing-brand">
    <svg class="landing-logo" viewBox="0 0 48 56" aria-hidden="true">
      <path
        fill="rgba(20, 184, 166, 0.08)"
        stroke="#14B8A6"
        stroke-width="2.2"
        stroke-linejoin="round"
        d="M24 3 L42 10 V27 C42 40 33 49 24 53 C15 49 6 40 6 27 V10 Z"
      />
    </svg>
    <h1 class="landing-brand-name">URL Scanner<em>AI + VirusTotal</em></h1>
  </div>

  <div class="landing-title-block">
    <h2 class="landing-headline">Secure Your Digital Footprint</h2>
    <div class="title-scan-rail" aria-hidden="true">
      <div class="scanning-line"></div>
    </div>
  </div>

  {% if error %}
  <div class="alert-error" role="alert">{{ error }}</div>
  {% endif %}

  <form id="scanForm" action="/predict" method="POST" class="scan-pill">
    <input
      type="text"
      id="urlInput"
      name="url"
      class="scan-input"
      placeholder="Enter target URL to scan"
      autocomplete="off"
      required
    >
    <button type="submit" id="submitBtn" class="btn-scan">
      <span class="btn-scan-label">Scan Now</span>
      <span class="btn-scan-spinner" aria-hidden="true"></span>
    </button>
  </form>

  <div class="feature-row">
    <div class="feature-chip">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
      </svg>
      <span>Real-Time Threat Intel</span>
    </div>
    <div class="feature-chip">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/>
      </svg>
      <span>Hybrid ML Engine</span>
    </div>
    <div class="feature-chip">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 3l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-3z"/>
      </svg>
      <span>VirusTotal Verified</span>
    </div>
  </div>
</main>
{% endblock %}
