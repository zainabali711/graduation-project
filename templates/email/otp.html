<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your CyberScan verification code</title>
</head>
<body style="font-family: Arial, sans-serif; background:linear-gradient(135deg,#0D1117 0%,#1C010C 40%,#2F0410 70%,#3C050F 100%); color:#C9D1D9; padding:24px;">
  <div style="max-width:560px;margin:0 auto;background:#1C010C;border:1px solid rgba(139,26,61,0.35);border-radius:12px;padding:28px;">
    <h1 style="color:#FFFFFF;margin-top:0;">CyberScan</h1>
    <p>Hello {{ username }},</p>
    <p>Use this code to verify your email and activate your account:</p>
    <p style="margin:28px 0;text-align:center;">
      <span style="display:inline-block;font-family:Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:0.35em;color:#FFFFFF;background:rgba(139,26,61,0.25);border:1px solid rgba(139,26,61,0.45);border-radius:12px;padding:14px 22px;">
        {{ code }}
      </span>
    </p>
    <p style="color:#8B949E;font-size:14px;">This code expires in 10 minutes.</p>
    <p style="color:#8B949E;font-size:13px;">If you did not create this account, you can ignore this email.</p>
  </div>
</body>
</html>
