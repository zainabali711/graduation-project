<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify your CyberScan account</title>
</head>
<body style="font-family: Arial, sans-serif; background:linear-gradient(135deg,#0D1117 0%,#1C010C 40%,#2F0410 70%,#3C050F 100%); color:#C9D1D9; padding:24px;">
  <div style="max-width:560px;margin:0 auto;background:#1C010C;border:1px solid rgba(139,26,61,0.35);border-radius:12px;padding:28px;">
    <h1 style="color:#FFFFFF;margin-top:0;">CyberScan</h1>
    <p>Hello {{ username }},</p>
    <p>Thanks for registering. Please verify your email address to activate your account.</p>
    <p style="margin:28px 0;">
      <a href="{{ verify_url }}"
         style="display:inline-block;background:linear-gradient(135deg,#8B1A3D 0%,#40070D 100%);color:#FFFFFF;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;">
        Verify Email
      </a>
    </p>
    <p style="color:#8B949E;font-size:14px;">Or copy this link into your browser:<br>{{ verify_url }}</p>
    <p style="color:#8B949E;font-size:13px;">This link expires in 24 hours.</p>
  </div>
</body>
</html>
